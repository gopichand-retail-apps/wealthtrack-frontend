name: WealthTrack Frontend CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check out the matching backend for end-to-end tests
        run: |
          repo=https://github.com/gopichand-retail-apps/wealthtrack-backend.git
          ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git ls-remote --exit-code --heads "$repo" "$ref" > /dev/null || ref=main
          git clone --depth 1 --branch "$ref" "$repo" ../wealthtrack-backend
          npm ci --prefix ../wealthtrack-backend
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm audit
      - run: npm run test:e2e
        env:
          VITE_IS_MOCK: "true"
      - run: npm run test:e2e
        env:
          VITE_IS_MOCK: "false"
